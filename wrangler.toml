# TRAVERCE — Wrangler Configuration
# Cloudflare Pages + D1 Database
# NOTE: Use CLOUDFLARE_ACCOUNT_ID=37031315226e6658c9809e25798aad19 env var for D1 commands

name = "traverce-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]



# ── D1 DATABASE ─────────────────────────────────────────────────────────
# Run once to create: wrangler d1 create traverce-artists
# Then copy the database_id from the output below.

[[d1_databases]]
binding       = "DB"
database_name = "traverce-artists"
database_id   = "095ca218-d06f-43c5-9847-c3a00158f9fc"
